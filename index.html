<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Parcial I - Programación IV</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

    <!-- Dexie -->
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.js"></script>
</head>

<body>
<div id="app" class="container mt-4">

    <h1 class="text-center mb-4">Sistema de Biblioteca</h1>

    <!-- NAV TABS -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#autores">Autores</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#libros">Libros</button>
        </li>
    </ul>

    <div class="tab-content mt-3">

        <!-- ================= AUTORES ================= -->
        <div class="tab-pane fade show active" id="autores">

            <div class="card p-3 shadow">
                <h4>Registro de Autor</h4>

                <form @submit.prevent="guardarAutor">
                    <input v-model="autor.codigo" class="form-control mb-2" placeholder="Código">
                    <input v-model="autor.nombre" class="form-control mb-2" placeholder="Nombre">
                    <input v-model="autor.pais" class="form-control mb-2" placeholder="País">
                    <input v-model="autor.telefono" class="form-control mb-2" placeholder="Teléfono">
                    <button class="btn btn-primary w-100">Guardar</button>
                </form>

                <input v-model="buscarAutor" class="form-control mt-3" placeholder="Buscar por nombre o código">

                <table class="table table-striped mt-3">
                    <tr>
                        <th>Nombre</th>
                        <th>País</th>
                        <th>Acciones</th>
                    </tr>
                    <tr v-for="a in autoresFiltrados">
                        <td>{{a.nombre}}</td>
                        <td>{{a.pais}}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" @click="editarAutor(a)">Editar</button>
                            <button class="btn btn-danger btn-sm" @click="eliminarAutor(a.idAutor)">Eliminar</button>
                        </td>
                    </tr>
                </table>
            </div>

        </div>

        <!-- ================= LIBROS ================= -->
        <div class="tab-pane fade" id="libros">

            <div class="card p-3 shadow">
                <h4>Registro de Libro</h4>

                <form @submit.prevent="guardarLibro">
                    <input v-model="libro.isbn" class="form-control mb-2" placeholder="ISBN">
                    <input v-model="libro.titulo" class="form-control mb-2" placeholder="Título">
                    <input v-model="libro.editorial" class="form-control mb-2" placeholder="Editorial">
                    <input v-model="libro.edicion" class="form-control mb-2" placeholder="Edición">

                    <select v-model="libro.idAutor" class="form-control mb-2">
                        <option disabled value="">Seleccione Autor</option>
                        <option v-for="a in autores" :value="a.idAutor">
                            {{a.nombre}}
                        </option>
                    </select>

                    <button class="btn btn-success w-100">Guardar</button>
                </form>

                <input v-model="buscarLibro" class="form-control mt-3" placeholder="Buscar por título o ISBN">

                <table class="table table-striped mt-3">
                    <tr>
                        <th>Título</th>
                        <th>Editorial</th>
                        <th>Acciones</th>
                    </tr>
                    <tr v-for="l in librosFiltrados">
                        <td>{{l.titulo}}</td>
                        <td>{{l.editorial}}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" @click="editarLibro(l)">Editar</button>
                            <button class="btn btn-danger btn-sm" @click="eliminarLibro(l.idLibro)">Eliminar</button>
                        </td>
                    </tr>
                </table>
            </div>

        </div>

    </div>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
