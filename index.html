<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>SISTEMA ACADEMICO UGB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
</head>
<body class="bg-light">
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">SISTEMA UGB</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="#" @click="abrirVentana('alumnos')">Alumnos</a>
                    <a class="nav-link" href="#" @click="abrirVentana('materias')">Materias</a>
                    <a class="nav-link" href="#" @click="abrirVentana('docentes')">Docentes</a>
                    <a class="nav-link" href="#" @click="abrirVentana('matriculas')">Matrícula</a>
                    <a class="nav-link" href="#" @click="abrirVentana('inscripciones')">Inscripción</a>
                </div>
            </div>
        </nav>

        <div class="container pb-5">
            <div v-show="forms.alumnos.mostrar">
                <alumnos ref="alumnos" @buscar="buscar('busqueda_alumnos', 'obtenerAlumnos')"></alumnos>
                <busqueda_alumnos ref="busqueda_alumnos" @modificar="modificar('alumnos', 'modificarAlumno', $event)"></busqueda_alumnos>
            </div>

            <div v-show="forms.materias.mostrar">
                <materias ref="materias" @buscar="buscar('busqueda_materias', 'obtenerMaterias')"></materias>
                <busqueda_materias ref="busqueda_materias" @modificar="modificar('materias', 'modificarMateria', $event)"></busqueda_materias>
            </div>

            <div v-show="forms.docentes.mostrar">
                <docentes ref="docentes" @buscar="buscar('busqueda_docentes', 'obtenerDocentes')"></docentes>
                <busqueda_docentes ref="busqueda_docentes" @modificar="modificar('docentes', 'modificarDocente', $event)"></busqueda_docentes>
            </div>

            <div v-show="forms.matriculas.mostrar">
                <matriculas ref="matriculas" @buscar="buscar('busqueda_matriculas', 'obtenerMatriculas')"></matriculas>
                <busqueda_matriculas ref="busqueda_matriculas"></busqueda_matriculas>
            </div>

            <div v-show="forms.inscripciones.mostrar">
                <inscripciones ref="inscripciones" @buscar="buscar('busqueda_inscripciones', 'obtener')"></inscripciones>
                <busqueda_inscripciones ref="busqueda_inscripciones"></busqueda_inscripciones>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>

    <script src="componentes/alumnos.js"></script>
    <script src="componentes/busqueda_alumnos.js"></script>
    <script src="componentes/materias.js"></script>
    <script src="componentes/busqueda_materias.js"></script>
    <script src="componentes/docentes.js"></script>
    <script src="componentes/busqueda_docentes.js"></script>
    <script src="componentes/matriculas.js"></script>
    <script src="componentes/busqueda_matriculas.js"></script>
    <script src="componentes/inscripciones.js"></script>
    <script src="componentes/busqueda_inscripciones.js"></script>
    
    <script src="main.js"></script>
</body>
</html>
